# Yellow Agent — audit. Read-only, enforcement: audit so it observes what would
# block without blocking the mission. Never granted policy-set rights.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /var/log, /workspace]
  read_write: [/tmp]
landlock:
  compatibility: best_effort
network_policies:
  observe:
    name: observe
    endpoints:
      - host: REPLACE_TARGET_HOST
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
    binaries:
      - { path: /usr/bin/curl }
